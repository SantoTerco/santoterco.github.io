name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o projeto
        run: unzip -q SantoTerco-App.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar o projeto Android
        working-directory: SantoTerco-App
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Compilar o APK
        working-directory: SantoTerco-App/android
        run: ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: SantoTerco-APK
          path: SantoTerco-App/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar para baixar direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Santo Terço APK ${{ github.run_number }}
          files: SantoTerco-App/android/app/build/outputs/apk/debug/app-debug.apk
