name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o projeto
        run: unzip -q "$(find . -name SantoTerco-App.zip | head -1)"

      - name: Marcar a versão do app
        run: sed -i "s/__BUILD__/${{ github.run_number }}/" SantoTerco-App/www/sw.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar o projeto Android
        working-directory: SantoTerco-App
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Aplicar o ícone do app
        working-directory: SantoTerco-App
        run: |
          find android/app/src/main/res -name 'ic_launcher*' -delete
          cp -r resources/res/* android/app/src/main/res/

      - name: Aplicar a tela de abertura
        continue-on-error: true
        working-directory: SantoTerco-App
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          python3 - <<'PY'
          import glob, math
          from PIL import Image
          bg = Image.open('resources/splash-bg.png').convert('RGB')
          mark = Image.open('resources/mark.png').convert('RGBA')
          for f in glob.glob('android/app/src/main/res/**/splash.png', recursive=True):
              w, h = Image.open(f).size
              k = max(w / bg.width, h / bg.height)
              b = bg.resize((math.ceil(bg.width * k), math.ceil(bg.height * k)), Image.LANCZOS)
              l, t = (b.width - w) // 2, (b.height - h) // 2
              out = b.crop((l, t, l + w, t + h)).convert('RGBA')
              m = int(min(w, h) * 0.8)
              mk = mark.resize((m, m), Image.LANCZOS)
              out.alpha_composite(mk, ((w - m) // 2, (h - m) // 2))
              out.convert('RGB').save(f)
              print('ok', f, w, h)
          PY

      - name: Compilar o APK
        working-directory: SantoTerco-App/android
        run: ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: SantoTerco-APK
          path: SantoTerco-App/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar para baixar direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Santo Terço APK ${{ github.run_number }}
          files: SantoTerco-App/android/app/build/outputs/apk/debug/app-debug.apk

  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o projeto
        run: unzip -q "$(find . -name SantoTerco-App.zip | head -1)"

      - name: Marcar a versão do app
        run: sed -i "s/__BUILD__/${{ github.run_number }}/" SantoTerco-App/www/sw.js

      - name: Montar o site
        run: |
          mkdir _site
          cp -r SantoTerco-App/site/. _site/
          cp -r SantoTerco-App/www _site/app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar o site
        id: deployment
        uses: actions/deploy-pages@v4
